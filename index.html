<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>♥</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #14080e;
    color: #ff4d79;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", monospace;
  }
  pre {
    font-size: clamp(6px, 1.7vw, 15px);
    line-height: 1;
    margin: 0;
    text-shadow: 0 0 6px rgba(255, 77, 121, .5);
    animation: beat 1.4s ease-in-out infinite;
  }
  #msg {
    margin-top: 24px;
    font-size: 20px;
    color: #ffc2d4;
    min-height: 1.5em;
    text-align: center;
    padding: 0 16px;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.05); }
    30% { transform: scale(1); }
    45% { transform: scale(1.03); }
  }
</style>
</head>
<body>
<pre id="heart"></pre>
<div id="msg"></div>

<script>
  const MESSAGE = "사랑해";
  const CHARS = "@#$%&*+=?!/|<>~01LOVE".split("");
  const ROWS = 40;
  const ASPECT = 1 / 0.6; // 글자 높이 / 글자 너비

  const dy = 2.7 / ROWS;
  const dx = dy / ASPECT;

  // 하트 영역 계산
  const mask = [];
  for (let r = 0; r < ROWS; r++) {
    const y = 1.4 - r * dy;
    const row = [];
    for (let x = -1.4; x <= 1.4; x += dx) {
      const f = Math.pow(x * x + y * y - 1, 3) - x * x * Math.pow(y, 3);
      row.push(f <= 0);
    }
    mask.push(row);
  }

  const rand = () => CHARS[Math.floor(Math.random() * CHARS.length)];
  const grid = mask.map(row => row.map(on => (on ? rand() : " ")));
  const render = n => grid.slice(0, n).map(r => r.join("")).join("\n");

  const pre = document.getElementById("heart");
  const msg = document.getElementById("msg");
  let n = 0;

  const draw = setInterval(() => {
    pre.textContent = render(++n);
    if (n >= ROWS) {
      clearInterval(draw);
      setInterval(() => {
        for (let k = 0; k < 40; k++) {
          const r = Math.floor(Math.random() * ROWS);
          const c = Math.floor(Math.random() * grid[r].length);
          if (mask[r][c]) grid[r][c] = rand();
        }
        pre.textContent = render(ROWS);
      }, 80);
      let j = 0;
      const type = setInterval(() => {
        msg.textContent = MESSAGE.slice(0, ++j);
        if (j >= MESSAGE.length) clearInterval(type);
      }, 200);
    }
  }, 50);
</script>
</body>
</html>
